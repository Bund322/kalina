# Деплой на свой хостинг (Timeweb / SprintHost) по FTP.
# Пока хостинг не выбран, запускается только вручную: Actions → «Деплой на хостинг» → Run workflow.
# Чтобы сайт обновлялся сам при каждом push в main, раскомментируйте блок push ниже.
# Нужные секреты репозитория (Settings → Secrets and variables → Actions) — см. README, раздел «Деплой».
name: Деплой на хостинг

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check-links
      - name: Залить dist/ на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
