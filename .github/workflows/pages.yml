# Временный показ сайта во время разработки: https://bund322.github.io/kalina/
# Собирается при каждом push в dev_seits. Когда сайт переедет на хостинг, этот workflow можно удалить.
name: GitHub Pages (превью)

on:
  push:
    branches: [dev_seits]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /kalina
      - run: npm run check-links
        env:
          SITE_BASE: /kalina
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
